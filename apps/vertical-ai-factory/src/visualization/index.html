<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vertical AI Factory - Graph Viewer</title>

    <!-- Mermaid.js for LangGraph -->
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>

    <!-- D3.js for Knowledge Graph -->
    <script src="https://d3js.org/d3.v7.min.js"></script>

    <style>
        :root {
            --bg-primary: #0f0f1a;
            --bg-secondary: #1a1a2e;
            --bg-card: #16213e;
            --text-primary: #e8e8e8;
            --text-secondary: #a0a0a0;
            --accent: #7c3aed;
            --accent-light: #a78bfa;
            --success: #10b981;
            --warning: #f59e0b;
            --border: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--bg-primary) 0%, var(--bg-secondary) 100%);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Header */
        header {
            text-align: center;
            padding: 30px 0;
            margin-bottom: 20px;
        }

        header h1 {
            font-size: 2.5rem;
            background: linear-gradient(135deg, var(--accent-light) 0%, var(--accent) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }

        header p {
            color: var(--text-secondary);
            font-size: 1.1rem;
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            justify-content: center;
        }

        .tab-btn {
            padding: 12px 30px;
            border: none;
            border-radius: 12px;
            background: var(--bg-card);
            color: var(--text-secondary);
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid var(--border);
        }

        .tab-btn:hover {
            background: rgba(124, 58, 237, 0.2);
            color: var(--text-primary);
        }

        .tab-btn.active {
            background: linear-gradient(135deg, var(--accent) 0%, #5b21b6 100%);
            color: white;
            border-color: var(--accent);
        }

        /* Content Panels */
        .panel {
            display: none;
            background: var(--bg-card);
            border-radius: 16px;
            padding: 30px;
            border: 1px solid var(--border);
            min-height: 600px;
        }

        .panel.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Stats Bar */
        .stats-bar {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .stat-item {
            background: rgba(124, 58, 237, 0.1);
            padding: 12px 20px;
            border-radius: 10px;
            border: 1px solid var(--border);
        }

        .stat-item .label {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        .stat-item .value {
            font-size: 1.3rem;
            font-weight: 600;
            color: var(--accent-light);
        }

        /* Mermaid Container */
        #mermaid-container {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 12px;
            padding: 30px;
            overflow: auto;
            text-align: center;
        }

        #mermaid-container .mermaid {
            display: inline-block;
        }

        /* D3 Graph Container */
        #d3-container {
            width: 100%;
            height: 600px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 12px;
            overflow: hidden;
        }

        #d3-container svg {
            width: 100%;
            height: 100%;
        }

        /* Node Legend */
        .legend {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
        }

        .legend-dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
        }

        .legend-dot.standard {
            background: #7c3aed;
        }

        .legend-dot.category {
            background: #10b981;
        }

        .legend-dot.company_table {
            background: #f59e0b;
        }

        .legend-dot.column {
            background: #06b6d4;
        }

        .legend-dot.standard_column {
            background: #ec4899;
        }

        /* Tooltip */
        .tooltip {
            position: absolute;
            background: var(--bg-card);
            border: 1px solid var(--accent);
            border-radius: 8px;
            padding: 12px;
            font-size: 0.85rem;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
            z-index: 1000;
            max-width: 300px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .tooltip.visible {
            opacity: 1;
        }

        /* Loading */
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 400px;
            color: var(--text-secondary);
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 15px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Error */
        .error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid #ef4444;
            color: #f87171;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
        }

        /* Filter Controls */
        .filter-controls {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .filter-controls select {
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--bg-secondary);
            color: var(--text-primary);
            font-size: 0.9rem;
            cursor: pointer;
        }

        .filter-controls select:focus {
            outline: none;
            border-color: var(--accent);
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1>🔮 Vertical AI Factory</h1>
            <p>LangGraph Workflow & Knowledge Graph Visualization</p>
        </header>

        <div class="tabs">
            <button class="tab-btn active" data-tab="langgraph">
                ⚡ LangGraph 워크플로우
            </button>
            <button class="tab-btn" data-tab="knowledge">
                🕸️ Knowledge Graph
            </button>
            <button class="tab-btn" data-tab="production">
                🏭 생산수불 흐름
            </button>
        </div>

        <!-- LangGraph Panel -->
        <div id="langgraph" class="panel active">
            <div class="stats-bar" id="langgraph-stats"></div>
            <div id="mermaid-container">
                <div class="loading">
                    <div class="spinner"></div>
                    LangGraph 워크플로우 로딩 중...
                </div>
            </div>
        </div>

        <!-- Knowledge Graph Panel -->
        <div id="knowledge" class="panel">
            <div class="filter-controls">
                <select id="company-filter">
                    <option value="all">모든 회사</option>
                    <option value="BINARY">Binary Soft</option>
                    <option value="DOU">Dou</option>
                    <option value="DOU_MES">Dou MES</option>
                </select>
                <select id="type-filter">
                    <option value="all">모든 타입</option>
                    <option value="standard">표준 테이블</option>
                    <option value="category">카테고리</option>
                    <option value="company_table">회사 테이블</option>
                    <option value="column">컬럼</option>
                </select>
            </div>
            <div class="legend">
                <div class="legend-item"><span class="legend-dot standard"></span> 표준 테이블</div>
                <div class="legend-item"><span class="legend-dot category"></span> 카테고리</div>
                <div class="legend-item"><span class="legend-dot company_table"></span> 회사 테이블</div>
                <div class="legend-item"><span class="legend-dot column"></span> 컬럼</div>
                <div class="legend-item"><span class="legend-dot standard_column"></span> 표준 컬럼</div>
            </div>
            <div class="stats-bar" id="knowledge-stats"></div>
            <div id="d3-container">
                <div class="loading">
                    <div class="spinner"></div>
                    Knowledge Graph 로딩 중...
                </div>
            </div>
        </div>

        <!-- Production Flow Panel (NEW) -->
        <div id="production" class="panel">
            <h2>🏭 생산수불 공정 흐름도</h2>
            <div class="filter-controls">
                <select id="production-month">
                    <option value="202410">2024년 10월</option>
                    <option value="202411">2024년 11월</option>
                    <option value="202412">2024년 12월</option>
                </select>
                <select id="production-scenario">
                    <option value="ACTUAL-2024">실적 (ACTUAL)</option>
                    <option value="FORECAST-2025Q1">속보 (FORECAST)</option>
                    <option value="PLAN-2025">계획 (PLAN)</option>
                </select>
                <button class="tab-btn" onclick="loadProductionFlow()" style="padding: 10px 20px;">
                    🔄 조회
                </button>
            </div>
            <div class="legend">
                <div class="legend-item"><span class="legend-dot" style="background:#4ade80"></span> 원재료 투입</div>
                <div class="legend-item"><span class="legend-dot" style="background:#60a5fa"></span> 공정 간 이동</div>
                <div class="legend-item"><span class="legend-dot" style="background:#a78bfa"></span> 완제품 출고</div>
                <div class="legend-item"><span class="legend-dot" style="background:#f87171"></span> 손실/불량</div>
            </div>
            <div class="stats-bar" id="production-stats"></div>
            <div id="sankey-container"
                style="width: 100%; height: 500px; background: rgba(0,0,0,0.2); border-radius: 12px; overflow: hidden;">
                <div class="loading">
                    <div class="spinner"></div>
                    데이터를 조회하려면 조회 버튼을 클릭하세요
                </div>
            </div>
        </div>
    </div>

    <!-- Tooltip -->
    <div class="tooltip" id="tooltip"></div>

    <script>
        // =============================================
        // Configuration
        // =============================================
        const API_BASE = 'http://localhost:8100';

        // =============================================
        // Tab Navigation
        // =============================================
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                // Update buttons
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');

                // Update panels
                const tabId = btn.dataset.tab;
                document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
                document.getElementById(tabId).classList.add('active');

                // Render Knowledge Graph when tab becomes visible
                if (tabId === 'knowledge' && graphData && !document.querySelector('#d3-container svg')) {
                    const container = document.getElementById('d3-container');
                    container.innerHTML = '';
                    renderD3Graph(graphData.nodes, graphData.links);
                }
            });
        });

        // =============================================
        // LangGraph Visualization (Mermaid)
        // =============================================
        async function loadLangGraph() {
            const container = document.getElementById('mermaid-container');
            const statsBar = document.getElementById('langgraph-stats');

            try {
                const response = await fetch(`${API_BASE}/api/graph/langgraph`);
                const data = await response.json();

                if (data.status === 'success') {
                    // Stats
                    statsBar.innerHTML = `
                        <div class="stat-item">
                            <div class="label">형식</div>
                            <div class="value">Mermaid</div>
                        </div>
                        <div class="stat-item">
                            <div class="label">설명</div>
                            <div class="value" style="font-size: 0.9rem;">${data.description}</div>
                        </div>
                    `;

                    // Render Mermaid
                    container.innerHTML = `<pre class="mermaid">${data.diagram}</pre>`;
                    mermaid.initialize({
                        startOnLoad: true,
                        theme: 'dark',
                        flowchart: {
                            curve: 'basis',
                            padding: 20
                        }
                    });
                    await mermaid.run();
                } else {
                    throw new Error('Failed to load LangGraph');
                }
            } catch (error) {
                container.innerHTML = `<div class="error">❌ LangGraph 로드 실패: ${error.message}</div>`;
            }
        }

        // =============================================
        // Knowledge Graph Visualization (D3.js)
        // =============================================
        let graphData = null;
        let simulation = null;

        async function loadKnowledgeGraph() {
            const container = document.getElementById('d3-container');
            const statsBar = document.getElementById('knowledge-stats');

            try {
                const response = await fetch(`${API_BASE}/api/graph/knowledge`);
                const data = await response.json();

                if (data.status === 'success') {
                    graphData = data;

                    // Stats
                    statsBar.innerHTML = `
                        <div class="stat-item">
                            <div class="label">노드</div>
                            <div class="value">${data.stats.total_nodes || data.nodes.length}</div>
                        </div>
                        <div class="stat-item">
                            <div class="label">엣지</div>
                            <div class="value">${data.stats.total_edges || data.links.length}</div>
                        </div>
                        <div class="stat-item">
                            <div class="label">카테고리</div>
                            <div class="value">${Object.keys(data.stats).filter(k => !k.startsWith('total')).length}</div>
                        </div>
                    `;

                    // Clear and DON'T render yet - wait for tab to be visible
                    container.innerHTML = '<div class="loading"><div class="spinner"></div>Knowledge Graph 데이터 준비 완료 - Knowledge Graph 탭을 클릭하세요</div>';

                    // If already on Knowledge tab, render immediately
                    if (document.getElementById('knowledge').classList.contains('active')) {
                        container.innerHTML = '';
                        renderD3Graph(data.nodes, data.links);
                    }
                } else {
                    throw new Error('Failed to load Knowledge Graph');
                }
            } catch (error) {
                container.innerHTML = `<div class="error">❌ Knowledge Graph 로드 실패: ${error.message}</div>`;
            }
        }

        function renderD3Graph(nodes, links) {
            const container = document.getElementById('d3-container');
            const width = container.clientWidth;
            const height = container.clientHeight;

            // Color scale by type
            const colorScale = {
                'standard': '#7c3aed',
                'category': '#10b981',
                'company_table': '#f59e0b',
                'column': '#06b6d4',
                'standard_column': '#ec4899',
                'unknown': '#6b7280'
            };

            // Create SVG
            const svg = d3.select('#d3-container')
                .append('svg')
                .attr('viewBox', [0, 0, width, height]);

            // Add zoom
            const g = svg.append('g');
            svg.call(d3.zoom()
                .extent([[0, 0], [width, height]])
                .scaleExtent([0.1, 4])
                .on('zoom', (event) => g.attr('transform', event.transform)));

            // Force simulation
            simulation = d3.forceSimulation(nodes)
                .force('link', d3.forceLink(links).id(d => d.id).distance(80))
                .force('charge', d3.forceManyBody().strength(-200))
                .force('center', d3.forceCenter(width / 2, height / 2))
                .force('collision', d3.forceCollide().radius(30));

            // Draw links
            const link = g.append('g')
                .selectAll('line')
                .data(links)
                .join('line')
                .attr('stroke', '#4b5563')
                .attr('stroke-opacity', 0.4)
                .attr('stroke-width', 1.5);

            // Draw nodes
            const node = g.append('g')
                .selectAll('circle')
                .data(nodes)
                .join('circle')
                .attr('r', d => d.type === 'category' ? 15 : d.type === 'standard' ? 12 : 8)
                .attr('fill', d => colorScale[d.type] || colorScale['unknown'])
                .attr('stroke', '#fff')
                .attr('stroke-width', 1.5)
                .style('cursor', 'pointer')
                .call(drag(simulation));

            // Add labels for ALL nodes with short names
            const labels = g.append('g')
                .selectAll('text')
                .data(nodes)
                .join('text')
                .text(d => {
                    // Extract short name from label (e.g., "COLUMN:ACCOUNT:account_code" -> "account_code")
                    const parts = d.label.split(':');
                    return parts[parts.length - 1] || d.label;
                })
                .attr('font-size', d => d.type === 'category' ? 11 : 9)
                .attr('fill', '#e8e8e8')
                .attr('text-anchor', 'middle')
                .attr('dy', d => d.type === 'category' ? -20 : -12)
                .style('pointer-events', 'none')
                .style('text-shadow', '0 0 3px rgba(0,0,0,0.8), 0 0 6px rgba(0,0,0,0.6)');

            // Tooltip
            const tooltip = document.getElementById('tooltip');

            node.on('mouseover', (event, d) => {
                tooltip.innerHTML = `
                    <strong>${d.label}</strong><br>
                    타입: ${d.type}<br>
                    ${d.category ? `카테고리: ${d.category}<br>` : ''}
                    ${d.company_code ? `회사: ${d.company_code}` : ''}
                `;
                tooltip.classList.add('visible');
            }).on('mousemove', (event) => {
                tooltip.style.left = (event.pageX + 15) + 'px';
                tooltip.style.top = (event.pageY - 10) + 'px';
            }).on('mouseout', () => {
                tooltip.classList.remove('visible');
            });

            // Tick function
            simulation.on('tick', () => {
                link
                    .attr('x1', d => d.source.x)
                    .attr('y1', d => d.source.y)
                    .attr('x2', d => d.target.x)
                    .attr('y2', d => d.target.y);

                node
                    .attr('cx', d => d.x)
                    .attr('cy', d => d.y);

                labels
                    .attr('x', d => d.x)
                    .attr('y', d => d.y);
            });
        }

        // Drag behavior
        function drag(simulation) {
            function dragstarted(event) {
                if (!event.active) simulation.alphaTarget(0.3).restart();
                event.subject.fx = event.subject.x;
                event.subject.fy = event.subject.y;
            }

            function dragged(event) {
                event.subject.fx = event.x;
                event.subject.fy = event.y;
            }

            function dragended(event) {
                if (!event.active) simulation.alphaTarget(0);
                event.subject.fx = null;
                event.subject.fy = null;
            }

            return d3.drag()
                .on('start', dragstarted)
                .on('drag', dragged)
                .on('end', dragended);
        }

        // =============================================
        // Filters
        // =============================================
        document.getElementById('company-filter').addEventListener('change', applyFilters);
        document.getElementById('type-filter').addEventListener('change', applyFilters);

        function applyFilters() {
            if (!graphData) return;

            const companyFilter = document.getElementById('company-filter').value;
            const typeFilter = document.getElementById('type-filter').value;

            let filteredNodes = graphData.nodes;
            let filteredLinks = graphData.links;

            // Filter nodes
            if (companyFilter !== 'all') {
                filteredNodes = filteredNodes.filter(n =>
                    !n.company_code || n.company_code === companyFilter || n.type === 'category' || n.type === 'standard'
                );
            }

            if (typeFilter !== 'all') {
                filteredNodes = filteredNodes.filter(n => n.type === typeFilter);
            }

            // Filter links to only include connected nodes
            const nodeIds = new Set(filteredNodes.map(n => n.id));
            filteredLinks = graphData.links.filter(l =>
                nodeIds.has(l.source.id || l.source) && nodeIds.has(l.target.id || l.target)
            );

            // Re-render
            document.getElementById('d3-container').innerHTML = '';
            if (simulation) simulation.stop();
            renderD3Graph(
                JSON.parse(JSON.stringify(filteredNodes)),
                JSON.parse(JSON.stringify(filteredLinks))
            );
        }

        // =============================================
        // Production Flow Visualization
        // =============================================
        async function loadProductionFlow() {
            const container = document.getElementById('sankey-container');
            const statsContainer = document.getElementById('production-stats');
            const yyyymm = document.getElementById('production-month').value;
            const scenario = document.getElementById('production-scenario').value;

            container.innerHTML = '<div class="loading"><div class="spinner"></div>생산 흐름 로딩 중...</div>';

            try {
                const response = await fetch(`${API_BASE}/api/graph/production-flow?yyyymm=${yyyymm}&scenario=${scenario}`);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();

                if (data.status !== 'success') throw new Error(data.detail || 'Unknown error');

                // Update stats
                statsContainer.innerHTML = `
                    <div class="stat-item">
                        <div class="label">기준년월</div>
                        <div class="value">${data.yyyymm}</div>
                    </div>
                    <div class="stat-item">
                        <div class="label">공정 수</div>
                        <div class="value">${data.stats.total_processes}</div>
                    </div>
                    <div class="stat-item">
                        <div class="label">흐름 수</div>
                        <div class="value">${data.stats.total_links}</div>
                    </div>
                    <div class="stat-item">
                        <div class="label">데이터 건수</div>
                        <div class="value">${data.stats.inventory_records}</div>
                    </div>
                `;

                // Render flow chart
                container.innerHTML = '';
                renderProductionFlow(data.data.nodes, data.data.links);

            } catch (error) {
                container.innerHTML = `<div class="error">❌ 생산 흐름 로드 실패: ${error.message}</div>`;
                console.error('Production flow error:', error);
            }
        }

        function renderProductionFlow(nodes, links) {
            const container = document.getElementById('sankey-container');
            const width = container.clientWidth || 900;
            const height = container.clientHeight || 500;

            const svg = d3.select('#sankey-container')
                .append('svg')
                .attr('width', width)
                .attr('height', height);

            // Color scale
            const colorMap = {
                'MAIN': '#60a5fa',
                'INSP': '#a78bfa',
                'REWORK': '#fbbf24',
                'EXTERNAL': '#4ade80',
                'LOSS': '#f87171'
            };

            const typeColorMap = {
                'NEW_INPUT': '#4ade80',
                'PROCESS_OUT': '#60a5fa',
                'GOODS_OUT': '#a78bfa',
                'LOSS': '#f87171'
            };

            // Filter only process nodes (not EXTERNAL/LOSS)
            const processNodes = nodes.filter(n => n.type !== 'EXTERNAL' && n.type !== 'LOSS');
            const extNodes = nodes.filter(n => n.type === 'EXTERNAL' || n.type === 'LOSS');

            // Layout: horizontal arrangement
            const nodeWidth = 120;
            const nodeHeight = 60;
            const padding = 60;
            const startX = 80;
            const centerY = height / 2;

            // Position nodes
            const nodePositions = {};

            // External input on left
            nodePositions['INPUT'] = { x: 20, y: centerY - 80 };

            // Process nodes in sequence
            processNodes.forEach((n, i) => {
                nodePositions[n.id] = {
                    x: startX + i * (nodeWidth + padding),
                    y: centerY
                };
            });

            // Output and Loss on right
            const lastX = startX + (processNodes.length) * (nodeWidth + padding);
            nodePositions['OUTPUT'] = { x: lastX, y: centerY - 60 };
            nodePositions['LOSS'] = { x: lastX, y: centerY + 80 };

            // Draw links (arrows)
            const g = svg.append('g');

            links.forEach(link => {
                const sourcePos = nodePositions[nodes[link.source]?.id] || nodePositions[link.source];
                const targetPos = nodePositions[nodes[link.target]?.id] || nodePositions[link.target];

                if (!sourcePos || !targetPos) return;

                const strokeWidth = Math.max(2, Math.min(20, link.value / 5));

                // Draw curved arrow
                const midX = (sourcePos.x + targetPos.x) / 2;
                const path = `M ${sourcePos.x + nodeWidth / 2} ${sourcePos.y}
                              Q ${midX} ${sourcePos.y - 30} ${targetPos.x - nodeWidth / 2} ${targetPos.y}`;

                g.append('path')
                    .attr('d', path)
                    .attr('fill', 'none')
                    .attr('stroke', typeColorMap[link.type] || '#60a5fa')
                    .attr('stroke-width', strokeWidth)
                    .attr('opacity', 0.6)
                    .attr('stroke-linecap', 'round');

                // Value label on link
                g.append('text')
                    .attr('x', midX)
                    .attr('y', sourcePos.y - 35)
                    .attr('text-anchor', 'middle')
                    .attr('fill', '#e8e8e8')
                    .attr('font-size', '11px')
                    .attr('font-weight', 'bold')
                    .text(link.value.toFixed(0));
            });

            // Draw nodes as rounded rectangles
            nodes.forEach(n => {
                const pos = nodePositions[n.id];
                if (!pos) return;

                const group = g.append('g')
                    .attr('transform', `translate(${pos.x - nodeWidth / 2}, ${pos.y - nodeHeight / 2})`);

                // Node rectangle
                group.append('rect')
                    .attr('width', nodeWidth)
                    .attr('height', nodeHeight)
                    .attr('rx', 10)
                    .attr('fill', colorMap[n.type] || '#4b5563')
                    .attr('stroke', '#fff')
                    .attr('stroke-width', 2)
                    .attr('opacity', 0.9);

                // Node name
                group.append('text')
                    .attr('x', nodeWidth / 2)
                    .attr('y', nodeHeight / 2 - 5)
                    .attr('text-anchor', 'middle')
                    .attr('fill', '#fff')
                    .attr('font-size', '12px')
                    .attr('font-weight', 'bold')
                    .text(n.name);

                // Node code
                group.append('text')
                    .attr('x', nodeWidth / 2)
                    .attr('y', nodeHeight / 2 + 12)
                    .attr('text-anchor', 'middle')
                    .attr('fill', 'rgba(255,255,255,0.7)')
                    .attr('font-size', '10px')
                    .text(n.id);

                // Area label
                if (n.area && n.area !== 'EXT') {
                    group.append('text')
                        .attr('x', nodeWidth / 2)
                        .attr('y', -8)
                        .attr('text-anchor', 'middle')
                        .attr('fill', '#a78bfa')
                        .attr('font-size', '10px')
                        .text(`[${n.area}]`);
                }
            });
        }

        // =============================================
        // Initialize
        // =============================================
        document.addEventListener('DOMContentLoaded', () => {
            loadLangGraph();
            loadKnowledgeGraph();
        });
    </script>
</body>

</html>
